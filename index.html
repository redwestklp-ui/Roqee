    <script>
      (function() {
        // Prevent extension scripts from crashing when overriding window.fetch
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            }
          });
        } catch (e) {
          try {
            var proto = window.constructor ? window.constructor.prototype : Window.prototype;
            if (proto) {
              var _protoFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return _protoFetch; },
                set: function(v) { _protoFetch = v; }
              });
            }
          } catch (e2) {}
        }

        // Suppress benign third-party Chrome extension errors from bubbling to app
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && (
              event.message.includes('Cannot set property fetch of #<Window>') ||
              event.message.includes('fetch of #<Window> which has only a getter')
            ))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
